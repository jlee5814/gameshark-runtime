# Stark Pocket: generate the Xcode project with `xcodegen` in this directory. The
# generated StarkPocket.xcodeproj is committed, so XcodeGen is optional.
name: StarkPocket
options:
  bundleIdPrefix: dev.gameshark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StarkKit:
    path: ../../mac/StarkMac
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  StarkPocket:
    type: application
    platform: iOS
    sources:
      - Sources
      # Stark's sprites, shared with StarkMac and never copied.
      - path: ../../mac/StarkMac/Assets/stark/manifest.json
        buildPhase: resources
      - path: ../../mac/StarkMac/Assets/stark/stark-atlas.png
        buildPhase: resources
      - path: ../../mac/StarkMac/Assets/stark/stark-atlas-gym.png
        buildPhase: resources
    dependencies:
      - package: StarkKit
        product: StarkKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stark Pocket
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: >-
          Hold the microphone button to talk to Stark. Audio is recognized on this iPhone and never saved.
        NSSpeechRecognitionUsageDescription: >-
          Stark turns what you say into text on this iPhone so you can review it before sending. Nothing is sent to a speech server.
        NSLocalNetworkUsageDescription: >-
          Stark Pocket talks to the GameShark runtime on your Mac over your local network.
        CFBundleURLTypes:
          - CFBundleURLName: dev.gameshark.starkpocket.pair
            CFBundleURLSchemes: [starkpocket]
    # Settings shows the commit this build came from, so a device report names its code.
    postBuildScripts:
      - name: Stamp build commit
        basedOnDependencyAnalysis: false
        script: |
          sha=$(git -C "$SRCROOT" rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
          git -C "$SRCROOT" diff --quiet HEAD 2>/dev/null || sha="$sha-dirty"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :StarkBuildSHA $sha" "$plist" 2>/dev/null ||
            /usr/libexec/PlistBuddy -c "Add :StarkBuildSHA string $sha" "$plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gameshark.starkpocket
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  StarkPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StarkPocket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StarkPocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StarkPocket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StarkPocket
schemes:
  StarkPocket:
    build:
      targets:
        StarkPocket: all
        StarkPocketTests: [test]
        StarkPocketUITests: [test]
    test:
      targets: [StarkPocketTests, StarkPocketUITests]
