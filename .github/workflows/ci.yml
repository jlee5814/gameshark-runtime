name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

  # StarkMac. Not a required check; the required `test` job above is unchanged.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sprite extraction tests
        run: uv run --with pillow==11.0.0 --with numpy==2.1.3 --with pytest pytest mac/tools

      - name: Swift unit tests
        run: mac/scripts/swiftpm.sh test

      - name: Integration against the real runtime
        env:
          STARK_INTEGRATION: "1"
        run: mac/scripts/swiftpm.sh test --filter IntegrationTests

      - name: Build StarkMac.app
        run: mac/scripts/build-app.sh

  # Stark Pocket (iOS). Not a required check. Unit tests run in a simulator; the live
  # handoff UI tests skip here because they need a runtime and StarkMac on the same Mac
  # (ios/scripts/pocket-demo.sh runs them).
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        id: sim
        run: |
          name="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and unit test StarkPocket
        run: |
          xcodebuild -project ios/StarkPocket/StarkPocket.xcodeproj -scheme StarkPocket \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath ios/StarkPocket/build test -only-testing:StarkPocketTests
