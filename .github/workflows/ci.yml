name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

  # StarkMac. Not a required check; the required `test` job above is unchanged.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Swift unit tests
        run: mac/scripts/swiftpm.sh test

      - name: Integration against the real runtime
        env:
          STARK_INTEGRATION: "1"
        run: mac/scripts/swiftpm.sh test --filter IntegrationTests

      - name: Build StarkMac.app
        run: mac/scripts/build-app.sh
